<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>园区分时容量台</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:980px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}input{padding:.45rem;margin-right:.5rem}</style></head><body><h1>园区分时容量台</h1><p>检修、检查、排污许可、审计记录四类依据并表：同一设施同一时段取最大要求、只占一份容量。</p><p>结论更新后未执行指令按新依据重算，已下达指令保留待补依据；两名监管员先到先得；批次写入失败可按批恢复、重提不重复占容量；旧库缺依据升级为待核验基线。</p><div><input id="from" value="2026-10-06T08:00Z"><input id="to" value="2026-10-06T10:00Z"><button onclick="loadLedger()">查看容量台</button></div><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadLedger(){const f=document.getElementById('from').value,t=document.getElementById('to').value;const r=await fetch(`/api/ledger?from=${encodeURIComponent(f)}&to=${encodeURIComponent(t)}`,{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
